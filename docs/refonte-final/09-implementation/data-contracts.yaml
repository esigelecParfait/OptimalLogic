schema_version: 2
status: ready_for_review
offers:
  change_scope: frontend_only
  backend_change: forbidden
  existing_endpoint: /api/offres
  existing_database: Supabase.offres
  existing_database_fields: [code, nom_offre, client_type, prix, prix_abonnement, is_active, created_at]
  values_that_must_remain_database_driven: [nom_offre, prix, prix_abonnement]
  public_offer_count: 3
  code_mapping: verify_existing_codes_before_frontend_change
  invariants:
    - Ne modifier ni endpoint, ni schéma, ni requête, ni politique RLS.
    - Ne jamais coder en dur un nom ou un prix de secours.
    - Une valeur absente ou invalide ne devient jamais zéro.
    - Une offre non renvoyée est indisponible.
    - Le contenu explicatif frontend est relié au code existant après vérification.
request:
  endpoint: /api/demandes
  action: preserve_unchanged_and_regression_test
booking:
  endpoints: [/api/cal/slots, /api/cal/bookings]
  action: preserve_unchanged_and_regression_test
assistant:
  endpoints: [/api/chat/public, /api/chat/client, "/api/chat/[clientId]"]
  action: preserve_backend_and_update_only_approved_frontend_copy
protected:
  - Supabase schema and configuration
  - API route implementations
  - authentication and authorization
  - RLS policies
  - private and admin data contracts
