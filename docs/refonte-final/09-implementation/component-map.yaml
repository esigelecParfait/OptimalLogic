schema_version: 1
status: ready_for_review
visual_strategy:
  decision: DEC-011
  mode: code_native_motion
  static_first: true
  legacy_raster_consumption: forbidden
roots:
  ui: components/ui
  marketing: components/marketing
  visuals: components/visuals
  domain: components/domain
  motion: components/motion
primitives:
  - {id: container, target: components/ui/Container.tsx, rendering: server}
  - {id: section, target: components/ui/Section.tsx, rendering: server}
  - {id: stack, target: components/ui/Stack.tsx, rendering: server}
  - {id: cluster, target: components/ui/Cluster.tsx, rendering: server}
  - {id: surface, target: components/ui/Surface.tsx, rendering: server}
  - {id: button, target: components/ui/Button.tsx, rendering: server_by_default}
  - {id: heading, target: components/ui/Heading.tsx, rendering: server}
  - {id: visual-frame, target: components/ui/VisualFrame.tsx, rendering: server}
  - {id: diagram-label, target: components/ui/DiagramLabel.tsx, rendering: server}
visual_components:
  - {id: visual-home-convergence, component: SignalConvergence, target: components/visuals/SignalConvergence.tsx, base_rendering: server_svg, enhancement: motion_island}
  - {id: visual-home-system-flow, component: SystemFlow, target: components/visuals/SystemFlow.tsx, base_rendering: server_html, enhancement: motion_island}
  - {id: visual-home-audience-constellation, component: AudienceConstellation, target: components/visuals/AudienceConstellation.tsx, base_rendering: server_svg, enhancement: optional_motion_island}
  - {id: visual-home-handoff, component: HumanHandoffDiagram, target: components/visuals/HumanHandoffDiagram.tsx, base_rendering: server_svg, enhancement: motion_island}
  - {id: visual-services-channel-flow, component: ChannelFlow, target: components/visuals/ChannelFlow.tsx, base_rendering: server_svg, enhancement: motion_island}
  - {id: visual-services-context-clarifier, component: ContextClarifier, target: components/visuals/ContextClarifier.tsx, base_rendering: server_html, enhancement: motion_island}
  - {id: visual-services-qualification, component: QualificationSequence, target: components/visuals/QualificationSequence.tsx, base_rendering: server_html, enhancement: motion_island}
  - {id: visual-commerce-signal, component: CommerceSignal, target: components/visuals/CommerceSignal.tsx, base_rendering: server_svg, enhancement: optional_motion_island}
  - {id: visual-tpe-request-pipeline, component: RequestPipeline, target: components/visuals/RequestPipeline.tsx, base_rendering: server_html, enhancement: optional_motion_island}
  - {id: visual-startup-evidence-map, component: EvidenceMap, target: components/visuals/EvidenceMap.tsx, base_rendering: server_svg, enhancement: optional_motion_island}
  - {id: visual-contact-threshold, component: ContactThreshold, target: components/visuals/ContactThreshold.tsx, base_rendering: server_svg, enhancement: motion_island}
  - {id: visual-social-card, component: OpenGraphImage, target: app/opengraph-image.tsx, base_rendering: next_image_response, enhancement: none}
sections:
  home-hero: {component: HomeHero, rendering: server_plus_motion_island, visual: {id: visual-home-convergence, kind: semantic_diagram, static_fallback: complete}, motion: [signal-converge, reveal-copy]}
