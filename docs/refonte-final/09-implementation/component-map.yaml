  home-problem: {component: EditorialStatement, rendering: server, visual: {id: none, kind: none, static_fallback: complete}, motion: []}
  home-system-flow: {component: SystemChapter, rendering: server_plus_motion_island, visual: {id: visual-home-system-flow, kind: interface_composition, static_fallback: complete}, motion: [context-assemble]}
  home-audience-paths: {component: AudiencePaths, rendering: server_plus_optional_motion_island, visual: {id: visual-home-audience-constellation, kind: semantic_diagram, static_fallback: complete}, motion: [reveal-structure]}
  home-method: {component: ProcessList, rendering: server_plus_small_motion_island, visual: {id: none, kind: none, static_fallback: complete}, motion: [reveal-copy]}
