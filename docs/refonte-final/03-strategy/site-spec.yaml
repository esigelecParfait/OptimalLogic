project:
  client_name: OptimalLogic
  legal_name: OptimalLogic
  project_name: Refonte premium finale
  slug: optimallogic-refonte-final
  sector: Services numériques et automatisation des demandes
  locations: [France]
  languages: [fr]
business:
  audiences:
    - {id: commerce, name: Commerces locaux, problem: Présence peu claire et demandes difficiles à qualifier}
    - {id: tpe-pme, name: TPE et PME, problem: Demandes dispersées et suivi commercial irrégulier}
    - {id: startup, name: Startups, problem: Décisions produit prises avec trop peu de signaux exploitables}
  value_proposition: Clarifier la présence en ligne et transformer chaque demande utile en contexte, priorité et prochaine action humaine.
  offers:
    - {code: commerce_intelligent, audience: commerce, count_in_category: 1, pricing_authority: Supabase}
    - {code: tpe_pme_croissance, audience: tpe-pme, count_in_category: 1, pricing_authority: Supabase}
    - {code: tpe_pme_performance, audience: tpe-pme, count_in_category: 2, pricing_authority: Supabase}
    - {code: startup_validation, audience: startup, count_in_category: 1, pricing_authority: Supabase}
    - {code: startup_launch, audience: startup, count_in_category: 2, pricing_authority: Supabase}
  differentiators:
    - Installation adaptée au parcours existant du client.
    - Qualification et transmission orientées vers une décision humaine.
    - Accompagnement mensuel facultatif.
  proofs: []
conversion:
  primary_goal: Obtenir une prise de rendez-vous qualifiée.
  primary_cta: {label: Prendre rendez-vous, destination: /prise-de-rdv}
  secondary_goals:
    - Envoyer une demande contextualisée via /contact.
    - Comprendre l'offre adaptée via /tarifs.
  critical_journeys:
    - {id: JOURNEY-001, start: /, steps: [/services, /tarifs, /prise-de-rdv], result: Créneau confirmé}
    - {id: JOURNEY-002, start: /services, steps: [/contact], result: Demande enregistrée et confirmation affichée}
    - {id: JOURNEY-003, start: /aide, steps: [/contact], result: Reprise humaine proposée}
site:
  profile: authenticated
  pages:
    - {id: home, title: Accueil, slug: /, purpose: Positionner et orienter, primary_cta: Prendre rendez-vous, sections: [hero, principles, problem, system, audiences, method, handoff, final-cta]}
    - {id: services, title: Services, slug: /services, purpose: Expliquer les capacités et parcours, primary_cta: Voir les offres, sections: [hero, presence, demand-system, audiences, installation, support, faq, final-cta]}
    - {id: pricing, title: Tarifs, slug: /tarifs, purpose: Comparer cinq offres avec données Supabase, primary_cta: Choisir une offre, sections: [hero, data-state, audience-tabs, offer-detail, support, process, faq, request]}
    - {id: contact, title: Contact, slug: /contact, purpose: Collecter une demande contextualisée, primary_cta: Envoyer la demande, sections: [hero, expectations, form, alternatives, privacy]}
    - {id: booking, title: Prise de rendez-vous, slug: /prise-de-rdv, purpose: Réserver un échange, primary_cta: Confirmer le créneau, sections: [hero, preparation, calendar, summary, fallback]}
    - {id: help, title: Aide, slug: /aide, purpose: Répondre puis orienter vers un humain, primary_cta: Contacter l'équipe, sections: [context, conversation, human-fallback]}
    - {id: legal-notice, title: Mentions légales, slug: /mentions-legales, purpose: Information légale, primary_cta: null, sections: [document]}
    - {id: privacy, title: Confidentialité, slug: /confidentialite, purpose: Information sur les données, primary_cta: null, sections: [document]}
    - {id: cookies, title: Cookies, slug: /cookies, purpose: Information et choix, primary_cta: null, sections: [document]}
  navigation: [/services, /tarifs, /contact, /prise-de-rdv]
  footer_links: [/mentions-legales, /confidentialite, /cookies]
  languages: [fr]
content:
  provided:
    - Logo et palette présents sur main.
    - Routes, intégrations et anciens documents commerciaux du dépôt.
    - Décisions sur le catalogue et les prix Supabase.
  to_create:
    - Contenus publics complets.
    - Microcopy des états et erreurs.
    - Métadonnées SEO par route.
    - Visuels abstraits et schémas sémantiques.
  prohibited_claims:
    - Chiffres, résultats, clients, témoignages ou certifications non sourcés.
    - Dashboard public.
    - Téléphone ou SMS sans intégration prouvée.
    - Prix ou noms d'offres codés en dur.
brand:
  assets:
    - {id: logo, status: available, source: repository}
    - {id: inter-font, status: available, source: app/fonts}
    - {id: space-grotesk-font, status: available, source: app/fonts}
  logo_status: locked
  palette: ["#050505", "#FFFFFF", "#2EE6A8"]
  typography: [Inter, Space Grotesk, Lora proposed]
  visual_references: [Span, Sevora]
  avoid: [generic_saas_dashboard, fake_proof, excessive_glow, custom_cursor, scroll_jacking]
backend:
  modules: [lead-capture, booking-cal, client-auth, client-portal, email-brevo, assistant-ai, analytics-consent]
  integrations:
