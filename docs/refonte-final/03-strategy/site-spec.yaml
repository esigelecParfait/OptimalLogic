spec_version: "1.2"
status: ready_for_review
project:
  client_name: OptimalLogic
  project_name: Refonte premium finale
  branch: champion
  languages: [fr]
business:
  audiences:
    - {id: entreprises, name: Entreprises, problem: Présence digitale peu claire et demandes entrantes difficiles à traiter}
    - {id: commerces, name: Commerces, problem: Appels et messages manqués pendant l'activité}
    - {id: tpe-pme, name: TPE et PME, problem: Qualification et transmission irrégulières des demandes}
  value_proposition: Clarifier la présence digitale et prendre en charge les demandes entrantes pour les rendre exploitables.
  offers:
    - {id: digital_presence, public_name: "Présence digitale", database_code: commerce_intelligent}
    - {id: reception_sms, public_name: "Accueil & qualification par SMS", database_code: tpe_pme_croissance}
    - {id: reception_calls_sms, public_name: "Accueil & qualification par appels + SMS", database_code: tpe_pme_performance}
  catalog_invariants:
    count: 3
    backend_change: forbidden
    database_contract_change: forbidden
    database_authority: [nom_offre, prix, prix_abonnement]
    hardcoded_name_or_price_fallback: forbidden
conversion:
  primary_cta: {label: Prendre rendez-vous, destination: /prise-de-rdv}
  journeys:
    - {start: /, steps: [/services, /tarifs, /prise-de-rdv]}
    - {start: /services, steps: [/contact]}
site:
  pages:
    - {id: home, title: Accueil, slug: /, strong_visuals: [request_never_lost]}
    - {id: services, title: Services, slug: /services, strong_visuals: [calls_sms_demo, digital_presence_gallery]}
    - {id: offers, title: Offres, slug: /tarifs, strong_visuals: []}
    - {id: booking, title: Prise de rendez-vous, slug: /prise-de-rdv, strong_visuals: []}
    - {id: contact, title: Contact, slug: /contact, strong_visuals: []}
    - {id: help, title: Aide, slug: /aide, strong_visuals: []}
  navigation:
    primary: [/services, /tarifs, /prise-de-rdv, /contact]
    header_action: {label: Connexion, destination: /connexion}
content:
  prohibited_claims:
    - Résultats, clients, témoignages ou certifications non sourcés.
    - Appels ou SMS illimités.
    - Dashboard public.
    - Prix ou noms d'offres codés en dur.
brand:
  logo_status: locked
  palette: ["#0B0D0F", "#15191D", "#F1F0EB", "#9CA3AA", "#315866", "#66877D", "#2A3035"]
  visual_reference: Framer
  real_photography: allowed_with_rights_for_digital_presence
  generated_raster: forbidden
backend:
  action: preserve_unchanged
  protected: [supabase, offer_configuration, api_routes, auth, private_routes, admin_routes, rls]
quality:
  accessibility_target: WCAG 2.2 AA
  viewports: [320, 390, 768, 1024, 1440]
open_questions:
  - {id: Q-002, question: Confirmer volumes inclus et dépassements SMS/minutes, blocking: true}
  - {id: Q-003, question: Valider les photographies et leurs droits, blocking: true}
