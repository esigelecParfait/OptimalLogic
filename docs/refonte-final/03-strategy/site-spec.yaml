    - {name: entreprise, purpose: contextualiser_la_demande, required: false, sensitive: false}
    - {name: message, purpose: qualifier_le_besoin, required: true, sensitive: true}
    - {name: offer_code, purpose: rattacher_loffre, required: false, sensitive: false}
  controller: OptimalLogic
  retention:
