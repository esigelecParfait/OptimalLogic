schema_version: 1
status: ready_for_review
visual_strategy:
  decision: DEC-011
  mode: code_native_motion
  decorative_photography: forbidden
  generated_raster: forbidden
  authentic_evidence_media: allowed_if_sourced
  static_fallback_required: true

rules:
  exact_information_is_code_native: true
  no_fake_interface_or_proof: true
  no_visual_information_motion_only: true
  mobile_diagrams_are_recomposed_not_cropped: true
  generated_directory_is_historical_only: true

assets: []

