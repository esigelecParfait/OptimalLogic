code_native_media:
  - id: visual-home-convergence
    type: semantic_diagram
    implementation: inline_svg
    sections: [home-hero, home-final-cta]
    purpose: Montrer plusieurs signaux convergeant vers une prochaine action lisible.
    labels: [Signal, Contexte, Priorité, Prochaine action]
    content_source: docs/refonte-final/04-content/page-content.yaml#home-hero
    informative: true
    accessible_name: Des signaux dispersés convergent vers une prochaine action.
    static_fallback: Diagramme complet avec tous les chemins et libellés visibles.
    mobile: Quatre étapes verticales reliées ; aucune dépendance au survol.
    motion_preset: signal-converge
  - id: visual-home-system-flow
    type: interface_composition
    implementation: semantic_html
    sections: [home-system-flow]
    purpose: Expliquer le mécanisme complet d’OptimalLogic.
    labels: [Présence, Demande, Qualification, Transmission, Décision humaine]
    content_source: docs/refonte-final/04-content/page-content.yaml#home-system-flow
    informative: true
    accessible_name: Cinq étapes de la présence à la décision humaine.
    static_fallback: Cinq panneaux ordonnés avec relations explicites.
    mobile: Panneaux verticaux numérotés.
    motion_preset: context-assemble
  - id: visual-home-audience-constellation
    type: semantic_diagram
    implementation: inline_svg
    sections: [home-audience-paths]
    purpose: Relier Commerce, TPE/PME et Startup au même mécanisme sans les confondre.
    labels: [Commerce, TPE/PME, Startup, Contexte, Décision]
    content_source: docs/refonte-final/04-content/page-content.yaml#home-audience-paths
    informative: true
    accessible_name: Trois audiences reliées à un même système de contexte et décision.
    static_fallback: Trois branches visibles autour d’un noyau commun.
    mobile: Trois parcours empilés partageant un même en-tête.
    motion_preset: reveal-structure
  - id: visual-home-handoff
    type: semantic_diagram
    implementation: inline_svg
    sections: [home-human-handoff]
    purpose: Distinguer la préparation automatique de la décision humaine.
    labels: [Contexte, Priorité, Prochaine action, Décision humaine]
    content_source: docs/refonte-final/04-content/page-content.yaml#home-human-handoff
    informative: true
    accessible_name: Le contexte préparé est transmis à une personne qui décide.
    static_fallback: Les quatre états et la frontière humaine sont immédiatement visibles.
    mobile: Transmission verticale vers un panneau humain final.
    motion_preset: human-handoff
  - id: visual-services-channel-flow
    type: semantic_diagram
    implementation: inline_svg
    sections: [services-hero]
    purpose: Montrer les points de contact réellement couverts par les contenus approuvés.
    labels: [Site, Formulaire, Rendez-vous, Assistant, Équipe]
    content_source: docs/refonte-final/04-content/page-content.yaml#services-hero
    informative: true
    accessible_name: Les points de contact transmettent leur contexte à l’équipe.
    static_fallback: Tous les canaux et la destination équipe sont visibles.
    mobile: Liste verticale des canaux vers une destination commune.
    motion_preset: signal-converge
  - id: visual-services-context-clarifier
    type: interface_composition
    implementation: semantic_html
    sections: [services-presence]
    purpose: Montrer comment une présentation dispersée devient une proposition lisible.
    labels: [Activité, Offre, Pour qui, Prochaine action]
    content_source: docs/refonte-final/04-content/page-content.yaml#services-presence
    informative: true
    accessible_name: Quatre informations structurent la présence en ligne.
    static_fallback: Les informations sont déjà organisées dans quatre panneaux.
    mobile: Panneaux empilés dans l’ordre de lecture.
    motion_preset: context-assemble
  - id: visual-services-qualification
    type: interface_composition
    implementation: semantic_html
    sections: [services-demand-system]
    purpose: Expliquer la préparation d’une demande avant reprise humaine.
    labels: [Collecter, Qualifier, Transmettre, Suivre]
    content_source: docs/refonte-final/04-content/page-content.yaml#services-demand-system
    informative: true
    accessible_name: Une demande est collectée, qualifiée, transmise puis suivie.
    static_fallback: Les quatre étapes et leurs relations sont visibles.
    mobile: Quatre panneaux verticaux.
    motion_preset: context-assemble
  - id: visual-commerce-signal
    type: semantic_diagram
    implementation: inline_svg
    sections: [services-audience-commerce]
    purpose: Contextualiser une demande locale avant la reprise humaine.
    labels: [Demande locale, Intention, Coordonnées, Reprise humaine]
    content_source: docs/refonte-final/04-content/page-content.yaml#services-audience-commerce
    informative: true
    accessible_name: Une demande locale transmet intention et coordonnées à une personne.
    static_fallback: Flux complet visible.
    mobile: Étapes verticales compactes.
    motion_preset: reveal-structure
  - id: visual-tpe-request-pipeline
    type: interface_composition
    implementation: semantic_html
    sections: [services-audience-tpe]
    purpose: Montrer le routage d’une demande avec responsabilité et suivi.
    labels: [Entrée, Contexte, Priorité, Responsable, Suivi]
    content_source: docs/refonte-final/04-content/page-content.yaml#services-audience-tpe
    informative: true
    accessible_name: Une demande reçoit un contexte, une priorité, un responsable et un suivi.
    static_fallback: Les cinq colonnes de l’interface illustrative sont complètes.
    mobile: Pipeline vertical avec responsable explicite.
    motion_preset: reveal-structure
  - id: visual-startup-evidence-map
    type: semantic_diagram
    implementation: inline_svg
    sections: [services-audience-startup]
    purpose: Relier une hypothèse à des signaux avant décision.
    labels: [Hypothèse, Signal, Entretien, Décision]
    content_source: docs/refonte-final/04-content/page-content.yaml#services-audience-startup
    informative: true
    accessible_name: Une hypothèse est confrontée à un signal et un entretien avant décision.
    static_fallback: Les quatre nœuds sont visibles avec leurs relations.
    mobile: Ligne verticale de quatre étapes.
    motion_preset: reveal-structure
  - id: visual-contact-threshold
    type: semantic_diagram
    implementation: inline_svg
    sections: [contact-hero]
    purpose: Présenter le contact comme un passage vers un échange contextualisé.
    labels: [Situation actuelle, Contexte, Échange utile]
    content_source: docs/refonte-final/04-content/page-content.yaml#contact-hero
    informative: true
    accessible_name: La situation actuelle franchit un seuil vers un échange contextualisé.
    static_fallback: Les deux espaces et le seuil sont visibles immédiatement.
    mobile: Seuil horizontal remplacé par une progression verticale.
    motion_preset: threshold-cross
  - id: visual-social-card
    type: social_card
    implementation: next_image_response
    sections: [global-metadata]
    purpose: Produire la carte sociale à partir du logo, de la typographie et du motif de convergence.
    labels: [OptimalLogic, Chaque demande mérite une prochaine action.]
    content_source: docs/refonte-final/04-content/seo-content.yaml
    informative: true
    accessible_name: OptimalLogic — Chaque demande mérite une prochaine action.
    static_fallback: ImageResponse produit une composition fixe 1200 × 630.
    mobile: not_applicable
    motion_preset: none

budget:
  initial_raster_transfer_kb_max: 0
  initial_motion_runtime_gzip_kb_target: 45
  strong_sequences_per_page_max: 2
  inline_svg_nodes_per_visual_max: 24
