schema_version: 1
status: ready_for_review
components:
  code_native_visual:
    states: [static_complete, enhancing, complete]
    presets: [signal-converge, context-assemble, threshold-cross, human-handoff, reveal-structure]
    requirements: [server_rendered_final_information, accessible_name, no_motion_only_information, reduced_state_immediate]
  button:
    states: [idle, hover, focus_visible, pressed, disabled, loading]
    preset: button-feedback
    requirements: [independent_focus_ring, stable_loading_width, no_magnetic_effect]
  accordion:
    states: [collapsed, expanded, focus_visible]
    preset: accordion
    requirements: [aria_expanded, aria_controls, keyboard_activation]
  audience_tabs:
    states: [idle, selected, focus_visible]
    preset: segmented-control
    requirements: [arrow_key_navigation, roving_tabindex, active_offer_visible]
  form_field:
    states: [empty, focused, valid, invalid, disabled]
    preset: form-state
    requirements: [persistent_label, described_error, no_color_only_error]
  form_submission:
    states: [idle, submitting, success, server_error]
    preset: form-state
    requirements: [aria_live_result, preserve_values_on_error, duplicate_submit_guard]
  offer_data:
    states: [loading, available, partial, unavailable]
    preset: form-state
    requirements: [never_convert_missing_price_to_zero, contact_recovery]
  booking_slot:
    states: [available, selected, unavailable, submitting, confirmed, failed]
    preset: booking-selection
    requirements: [keyboard_selection, persistent_summary, explicit_timezone]
  assistant_message:
    states: [queued, streaming, complete, failed]
    preset: assistant-stream
    requirements: [aria_live_polite, stop_control, human_fallback, no_typing_animation]
  mobile_navigation:
    states: [closed, open, item_focus]
    preset: reveal-structure
    requirements: [focus_trap, escape_closes, restore_focus, body_scroll_lock]
