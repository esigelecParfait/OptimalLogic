    sections:
      auth-panel: {presets: [form-state], purpose: confirmer_les_etats_auth, priority: feedback, mobile_override: same, reduced_override: immediate_state, fallback: formulaire_visible}
global:
  navigation: [button-feedback]
  primary_actions: [button-feedback]
  route_transition: none
