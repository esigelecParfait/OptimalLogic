      services-optional-support: {presets: [], purpose: comparer_sans_distraction, priority: none, mobile_override: none, reduced_override: same, fallback: panneaux_visibles}
      services-faq: {presets: [accordion], purpose: ouvrir_les_reponses, priority: interaction, mobile_override: same, reduced_override: immediate_open_close, fallback: controles_visibles}
      services-final-cta: {presets: [], purpose: laisser_le_cta_stable, priority: none, mobile_override: none, reduced_override: same, fallback: actions_visibles}
