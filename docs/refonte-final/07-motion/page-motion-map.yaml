      contact-form: {presets: [form-state], purpose: confirmer_les_etats_formulaire, priority: feedback, mobile_override: same, reduced_override: immediate_state, fallback: formulaire_visible}
      contact-alternatives: {presets: [], purpose: actions_alternatives_stables, priority: none, mobile_override: none, reduced_override: same, fallback: actions_visibles}
      contact-privacy: {presets: [], purpose: information_legale_stable, priority: none, mobile_override: none, reduced_override: same, fallback: note_visible}
  /prise-de-rdv:
    strong_sequences: []
    sections:
      booking-hero: {presets: [], purpose: presenter_la_reservation, priority: none, mobile_override: none, reduced_override: same, fallback: contenu_visible}
      booking-preparation: {presets: [reveal-copy], purpose: rythmer_la_preparation, priority: low, mobile_override: simple_fade, reduced_override: immediate, fallback: etapes_visibles}
      booking-calendar: {presets: [booking-selection, form-state], purpose: confirmer_selection_et_etats, priority: interaction, mobile_override: same, reduced_override: immediate_state, fallback: calendrier_ou_repli_visible}
