      help-conversation: {presets: [assistant-stream, form-state], purpose: afficher_le_flux_et_les_erreurs, priority: feedback, mobile_override: same, reduced_override: same_behavior, fallback: interface_visible}
      help-human-fallback: {presets: [], purpose: garder_la_reprise_humaine_visible, priority: none, mobile_override: none, reduced_override: same, fallback: action_visible}
  legal-pages:
    strong_sequences: []
    sections:
      legal-document: {presets: [], purpose: lecture_stable, priority: none, mobile_override: none, reduced_override: same, fallback: document_visible}
  /connexion/**:
