schema_version: 1
status: ready_for_review
motion_spec: docs/refonte-final/07-motion/motion-spec.yaml
strong_moments_per_page_max: 2
pages:
  /:
    strong_sequences: [home-hero, home-system-flow]
    sections:
      home-hero: {presets: [signal-converge, reveal-copy], purpose: introduire_le_mecanisme, priority: strong, mobile_override: vertical_convergence_once, reduced_override: complete_static_diagram, fallback: diagramme_complet}
      home-signal-strip: {presets: [reveal-copy], purpose: renforcer_la_hierarchie, priority: low, mobile_override: simple_fade, reduced_override: immediate, fallback: liste_visible}
      home-problem: {presets: [], purpose: respiration_editoriale, priority: none, mobile_override: none, reduced_override: same, fallback: contenu_visible}
      home-system-flow: {presets: [context-assemble], purpose: expliquer_le_systeme, priority: strong, mobile_override: vertical_nodes_once, reduced_override: complete_static_composition, fallback: cinq_panneaux_visibles}
