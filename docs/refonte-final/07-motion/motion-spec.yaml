schema_version: 2
status: ready_for_review
tokens:
  fast: {duration_ms: 160, easing: "cubic-bezier(.22,1,.36,1)"}
  standard: {duration_ms: 320, easing: "cubic-bezier(.22,1,.36,1)"}
  scene: {duration_ms: 800, easing: "cubic-bezier(.22,1,.36,1)"}
presets:
  reveal: {properties: [opacity, transform], distance_px_max: 20}
  focus: {properties: [opacity, transform, border-color]}
  progress: {properties: [transform], transform_origin: left}
sequences:
  request_never_lost:
    page: /
    trigger: first_intersection_once
    duration_ms: 8500
    autoplay: once
    steps: [request_enters, channels_converge, details_extract, category_selected, request_ready, transmitted]
    final_state: transmitted_request
    replay: true
    performance: transform_and_opacity_only
  calls_sms_demo:
    page: /services
    trigger: explicit_user_action
    autoplay: false
    controls: [play, pause, replay, step]
    steps: [incoming_call, business_unavailable, voice_reception, need_detected, missing_detail, sms_sent, confirmation_received, summary_transmitted]
    final_state: qualified_request
    audio: never_automatic
  digital_presence_gallery:
    page: /services
    trigger: section_scroll_progress
    steps: [windows_enter_with_depth, sectors_crossfade, main_window_focuses, mobile_view_aligns, contact_paths_reveal]
    final_state: coherent_multichannel_presence
    photography: real_licensed
    rule: inspired_by_framer_quality_not_copied
reduced_motion:
  request_never_lost: show_final_state
  calls_sms_demo: accessible_manual_stepper
  digital_presence_gallery: show_final_gallery_without_parallax
  essential_information_without_javascript: required
budgets:
  simultaneous_strong_sequences: 1
  layout_animation: forbidden
  infinite_decorative_loop: forbidden
  mobile_parallax: forbidden
