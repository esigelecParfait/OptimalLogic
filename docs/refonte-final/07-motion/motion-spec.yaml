schema_version: 1
status: ready_for_review
system: {name: signal_to_decision, preferred_runtime: motion, css_fallback_required: true}
tokens:
  duration_ms: {instant: 0, feedback: 120, fast: 180, standard: 260, chapter: 420, narrative: 700}
  easing:
    enter: [0.16, 1, 0.3, 1]
    standard: [0.2, 0, 0, 1]
    exit: [0.4, 0, 1, 1]
  distance_px: {micro: 4, reveal: 16, chapter: 28}
presets:
  reveal-copy:
    trigger: intersection_once
    from: {opacity: 0, translate_y: 16}
    to: {opacity: 1, translate_y: 0}
    duration: standard
    easing: enter
  panel-reveal:
    trigger: intersection_once
    from: {opacity: 0, translate_y: 28}
    to: {opacity: 1, translate_y: 0}
    duration: chapter
    easing: enter
  list-stagger: {trigger: intersection_once, child: reveal-copy, max_children: 5, interval_ms: 55}
  signal-converge:
    trigger: after_first_paint_once
    sequence:
      - {target: signal_paths, effect: stroke_dashoffset_to_zero, duration: narrative}
      - {target: decision_threshold, effect: opacity_and_scale_to_one, duration: standard}
    loop: false
  flow-progress: {trigger: intersection_once, effect: activate_nodes_in_order, max_nodes: 5, duration_per_node_ms: 180, loop: false}
  section-shift:
    trigger: intersection_once
    from: {opacity: 0, translate_x: 20}
    to: {opacity: 1, translate_x: 0}
    duration: chapter
  button-feedback: {trigger: hover_focus_press, hover_translate_y: -1, press_scale: 0.98, duration: feedback}
  segmented-control: {trigger: user_selection, effect: active_indicator_translate, duration: fast, preserve_focus: true}
  accordion: {trigger: user_selection, effect: height_and_opacity, duration: standard, aria_expanded_required: true}
  form-state: {trigger: async_state_change, effect: opacity_crossfade_without_layout_shift, duration: fast}
  booking-selection: {trigger: user_selection, effect: border_background_and_summary_update, duration: fast, preserve_focus: true}
  assistant-stream: {trigger: response_stream, effect: append_without_typing_animation, duration: instant}
budget:
  strong_sequences_per_page: 2
  simultaneous_elements: 5
  maximum_sequence_ms: 900
  loop_count: 0
  allowed_properties: [opacity, transform, clip_path, stroke_dashoffset]
  conditional_properties: [height]
performance:
  smallest_client_island: true
  lazy_load_runtime_below_fold: true
  shared_intersection_observer: true
  will_change_only_during_animation: true
