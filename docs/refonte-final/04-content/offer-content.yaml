schema_version: 2
status: ready_for_review
catalog_count: 3
database_contract:
  action: preserve_unchanged
  authority: Supabase.offres
  observed_fields: [code, nom_offre, client_type, prix, prix_abonnement, is_active, created_at]
  frontend_reads_from_database: [nom_offre, prix, prix_abonnement]
  hardcoded_name_or_price_fallback: forbidden
  missing_or_invalid_behavior: unavailable_state
offers:
  digital_presence:
    database_code: commerce_intelligent
    reference_name_only: Présence digitale
    problem: L'entreprise est difficile à comprendre ou à contacter en ligne.
    promise: Une présence claire, crédible et orientée vers l'appel, le devis ou le rendez-vous.
    setup:
      reference_price_ht: 1290
      includes:
        - Audit de la présence digitale.
        - Clarification des services et messages.
        - Création ou refonte d'un site d'environ cinq pages.
        - Mobile, SEO de base et Google Business.
        - Formulaire, devis ou rendez-vous selon le parcours validé.
        - Configuration et déploiement.
    monthly:
      required: false
      reference_price_ht: 79
      includes: [hébergement, supervision, maintenance, mises à jour, petites modifications, assistance]
  reception_sms:
    database_code: tpe_pme_croissance
    reference_name_only: Accueil & qualification par SMS
    problem: Les messages restent sans réponse ou arrivent incomplets lorsque l'équipe est occupée.
    promise: Répondre, recueillir les informations utiles et transmettre une demande qualifiée.
    setup:
      reference_price_ht: 490
      includes: [analyse de l'entreprise, règles de réponse, canal SMS, scénarios de qualification, rendez-vous autorisé, connexion à OptimalLogic Réception, tests]
    monthly:
      required: true
      reference_price_ht: 99
      usage: SMS selon volume inclus puis dépassement
      includes: [système, hébergement, maintenance, suivi technique, centralisation, ajustements limités]
  reception_calls_sms:
    database_code: tpe_pme_performance
    reference_name_only: Accueil & qualification par appels + SMS
    problem: Un appel non décroché peut devenir un rendez-vous, un devis ou un client perdu.
    promise: Rester joignable et transmettre une demande complète sans interrompre l'activité.
    setup:
      reference_price_ht: 890
      includes: [analyse de l'entreprise, règles de réponse, accueil vocal, appels et SMS, qualification, horaires et transferts, rendez-vous et notifications, connexion à OptimalLogic Réception, tests]
    monthly:
      required: true
      reference_price_ht: 179
      usage: Minutes et SMS selon volumes inclus puis dépassement
      includes: [système, hébergement, maintenance, suivi technique, résumés, centralisation, ajustements limités]
presentation_rule: Les prix et noms de référence documentent les décisions commerciales; l'interface de production affiche uniquement les valeurs renvoyées par la BDD existante.
