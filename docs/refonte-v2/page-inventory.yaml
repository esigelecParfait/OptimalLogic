      path: /preview/modele-1/contact,
      surface: reference,
      access: public,
      decision: reference_only,
      purpose: Référence contact concept 1,
      primary_cta: null,
      data: contenu de démonstration,
      integrations: [],
      acceptance: Conservé hors navigation et noindex,
      notes: Ne pas brancher aux données de production.,
