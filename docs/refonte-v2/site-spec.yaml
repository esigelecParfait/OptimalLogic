content:
  provided:
    - contenus publiés du site actuel
    - arborescence et parcours du dépôt audité
    - cinq codes d'offres validés ; noms et prix lus depuis Supabase
    - logo OptimalLogic existant
  to_create:
    - narration premium page par page
    - axe explicite de gestion et suivi des demandes avec IA
    - microcontenus de réassurance sans preuve inventée
    - briefs et actifs visuels de marque
  prohibited_claims:
    - résultats chiffrés sans source
    - faux avis, faux clients ou faux partenaires
    - fonctionnalité IA ou canal présenté comme opérationnel sans validation technique
    - garantie de résultat commercial

brand:
  assets:
    - { id: logo-current, type: logo, source: src-repository, status: provided }
  logo_status: provided_review_required
  palette: [noir profond, blanc chaud, gris graphite, accent vert numérique]
  typography: [sans-serif géométrique, sans-serif lisible]
  visual_references:
    - site actuel pour la continuité sombre et technologique
    - cartes de flux sobres pour matérialiser le traitement des demandes sans dashboard public
  avoid:
    - esthétique SaaS générique bleu-violet
    - surcharge de glassmorphism
    - fausses captures produit
    - animations identiques sur chaque section

backend:
  modules:
    - authentification et rôles
    - demandes de contact et prospects
    - prise de rendez-vous
    - espace client et support
    - administration clients, prospects et métriques
    - assistant public et aide
  integrations: [Supabase, GitHub, email transactionnel, Google Business selon activation]
  roles: [anonymous, client, admin]

data:
  collected_fields:
    - identité et coordonnées du prospect
    - contexte et contenu de la demande
    - créneau de rendez-vous
    - données de compte et de support client
  controller: OptimalLogic
  retention:
    - confirmer les durées actuelles avant production
    - appliquer suppression ou anonymisation selon finalité
  sensitive_data: false

legal:
  jurisdiction: France
  legal_pages: [/mentions-legales, /confidentialite, /cookies]
  cookie_tracking: consent_required_for_non_essential
  professional_review_required: true

seo:
  production_domain: https://optimal-logic.com
  target_queries:
    - solutions digitales et IA pour TPE PME
    - gestion et suivi des demandes clients
    - site web et acquisition client
  local_locations: [France]

quality:
  accessibility_target: WCAG 2.2 AA
  supported_browsers: [chromium, firefox, webkit]
  viewports: [320, 390, 768, 1024, 1440]
  performance_budget:
    lighthouse_performance_min: 90
    lcp_lab_ms_max: 2500
    cls_max: 0.1
    tbt_lab_ms_max: 200
    initial_transfer_kb_max: 2048
  exceptions: []

delivery:
  repository_owner: OptimalLogic
  deployment_owner: OptimalLogic
  domain_owner: OptimalLogic
  account_owners: [OptimalLogic]
  approvals:
    brief:
      approved: false
      approved_by: null
      approved_at: null

assumptions:
  - Les routes de comparaison et preview restent des références internes pendant la refonte.
  - Les cinq offres publiques sont filtrées par code ; nom et prix viennent de la table offres.
  - Aucun prix de remplacement n'est affiché en cas d'indisponibilité de Supabase.
  - L'implémentation des nouveaux canaux de demande sera vérifiée avant toute promesse de disponibilité.

open_questions:
  - id: operational-channels
    question: Quels canaux et automatismes de gestion des demandes sont déjà opérationnels en production ?
    owner: OptimalLogic
    blocking: false
    due_before: validation du contenu et mise en production
