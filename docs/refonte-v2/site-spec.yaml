business:
  audiences:
    - commerces et indépendants
    - TPE et PME
    - startups
  value_proposition: >-
    Transformer la présence digitale en moteur d'acquisition, puis centraliser,
    qualifier, traiter et suivre les demandes entrantes grâce à l'IA et aux
    outils OptimalLogic.
  differentiators:
    - cadrage centré sur l'activité avant le choix des outils
    - continuité entre visibilité, conversion et suivi opérationnel
    - automatisations et IA intégrées aux parcours de demandes
    - accompagnement adapté au contexte commerce, entreprise ou startup
  offers:
    - {
        id: commerce-intelligent,
        database_code: commerce_intelligent,
        audience: commerce,
        name_source: offres.nom_offre,
        setup_price_source: offres.prix,
        monthly_price_source: offres.prix_abonnement,
        state: approved_public,
      }
    - {
