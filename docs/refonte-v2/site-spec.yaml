conversion:
  primary_goal: Obtenir une prise de rendez-vous qualifiée ou une demande de contact exploitable.
  primary_cta:
    label: Prendre rendez-vous
    destination: /prise-de-rdv
  secondary_goals:
    - découvrir les services
    - comparer les cinq offres publiées
    - contacter OptimalLogic
  critical_journeys:
    - id: marketing-to-booking
      trigger: CTA depuis une page marketing
      steps: [découverte, qualification, choix du créneau, confirmation]
      success: rendez-vous enregistré et confirmation visible
    - id: marketing-to-contact
      trigger: besoin de conseil ou demande spécifique
      steps: [formulaire, validation, transmission, accusé de réception]
      success: demande enregistrée et orientable

